# ================================================================
# bridge.yaml - Configuration du pont ros_gz_bridge
# Mappage des topics entre Gazebo Harmonic et ROS 2 Jazzy.
# Mode mono-robot (sim.launch.py).
#
# IMPORTANT : Gazebo Harmonic crée les topics DiffDrive/JointState
# sous /model/<model_name>/... automatiquement.
# ================================================================

# --- Commande de vitesse : ROS 2 -> Gazebo ---
- ros_topic_name: "cmd_vel"
  gz_topic_name: "/model/warehouse_bot/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

# --- Odometrie : Gazebo -> ROS 2 ---
- ros_topic_name: "odom"
  gz_topic_name: "/model/warehouse_bot/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# --- Transformations TF : Gazebo -> ROS 2 ---
- ros_topic_name: "tf"
  gz_topic_name: "/model/warehouse_bot/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

# --- Etats des articulations : Gazebo -> ROS 2 ---
- ros_topic_name: "joint_states_gz"
  gz_topic_name: "/world/world_demo/model/warehouse_bot/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# --- LiDAR 2D : Gazebo -> ROS 2 ---
- ros_topic_name: "/scan"
  gz_topic_name: "/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

# --- IMU : Gazebo -> ROS 2 ---
- ros_topic_name: "imu"
  gz_topic_name: "/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

# --- Horloge simulee : Gazebo -> ROS 2 ---
- ros_topic_name: "clock"
  gz_topic_name: "clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS
