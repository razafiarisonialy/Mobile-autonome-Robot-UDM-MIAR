# ================================================================
# nav2_params.yaml — Configuration Nav2 pour Industry Robot (Husky A300 Style)
#
# Basé sur la structure TurtleBot3 nav2_bringup, adapté pour :
#   - Cinématique skid-steer (4 roues motrices)
#   - Footprint rectangulaire 1.06 × 0.854 m (châssis + pare-chocs + roues)
#   - LiDAR filtré sur /scan_filtered (portée 0.12–10 m)
#   - Carte warehouse.yaml (résolution 0.05 m)
#
# Prérequis :
#   sudo apt install ros-jazzy-navigation2 ros-jazzy-nav2-bringup
# ================================================================

# ──────────────────────────────────────────────────────────────────
#  AMCL — Localisation par filtre à particules sur la carte
# ──────────────────────────────────────────────────────────────────
amcl:
  ros__parameters:
    use_sim_time: True

    # ── Frames ──
    global_frame_id: "map"
    odom_frame_id: "odom"
    base_frame_id: "base_footprint"
    scan_topic: "/scan_filtered"

    # ── Modèle de mouvement : Differential (adapté skid-steer) ──
    robot_model_type: "differential"
    alpha1: 0.2        # Bruit rotation dû à la rotation
    alpha2: 0.2        # Bruit rotation dû à la translation
    alpha3: 0.2        # Bruit translation dû à la translation
    alpha4: 0.2        # Bruit translation dû à la rotation
    alpha5: 0.2        # Bruit translation (spécifique omni/skid)

    # ── Filtre à particules ──
    max_particles: 3000
    min_particles: 500
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.1
    resample_interval: 1
    update_min_a: 0.2   # Rotation minimale (rad) avant mise à jour
    update_min_d: 0.25  # Translation minimale (m) avant mise à jour

    # ── Modèle laser ──
    laser_model_type: "likelihood_field"
    laser_max_range: 10.0    # Cohérent avec lidar.xacro (max 10m)
    laser_min_range: 0.12    # Cohérent avec lidar.xacro (min 0.12m)
    max_beams: 180           # 360 samples / 2 pour performance
    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5
    sigma_hit: 0.2
    lambda_short: 0.1

    # ── Pose initiale (position de spawn dans le monde) ──
    set_initial_pose: True
    initial_pose_x: 0.0
    initial_pose_y: 0.0
    initial_pose_z: 0.0
    initial_pose_yaw: 0.0

    # ── TF ──
    transform_tolerance: 1.0
    tf_broadcast: true

# ──────────────────────────────────────────────────────────────────
#  BT NAVIGATOR — Navigation par Behavior Tree
# ──────────────────────────────────────────────────────────────────
